version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thinkwires-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongo:27017/thinkwires
      - POSTGRES_URL=postgres://thinkwires:thinkwires_secret@postgres:5432/thinkwires
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=test_dev_jwt_secret_key_32_characters_long_min
      - JWT_ADMIN_SECRET=test_dev_admin_jwt_secret_key_32_chars
      - JWT_CANDIDATE_SECRET=test_dev_candidate_jwt_secret_key_32
    depends_on:
      mongo:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  mongo:
    image: mongo:7-jammy
    container_name: thinkwires-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: thinkwires-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=thinkwires
      - POSTGRES_PASSWORD=thinkwires_secret
      - POSTGRES_DB=thinkwires
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinkwires -d thinkwires"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: thinkwires-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  postgres_data:
  redis_data:
